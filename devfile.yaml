schemaVersion: 2.1.0
metadata:
  name: ai-in-devspaces
projects:
  - name: datasci-keras-gpt2-nlp
    git:
      remotes:
        origin: "https://github.com/redhat-na-ssa/datasci-keras-gpt2-nlp.git"
      checkoutFrom:
        revision: main
components:
  - name: universal-developer-image
    container:
      image: ghcr.io/redhat-na-ssa/udi-cuda:11.8.0-cudnn8-devel-ubi8-python39
      sourceMapping: /projects
      mountSources: true
      volumeMounts:
        - name: venv
          path: /home/user/.venv
      attributes:
        container-overrides:
          resources:
            limits:
              memory: 48Gi
              nvidia.com/gpu: 1
            requests:
              memory: 16Gi
              nvidia.com/gpu: 1
          tolerations:
            - effect: NoSchedule
              key: nvidia.com/gpu
              operator: Exists
  - name: venv
    volume:
      size: 1G
